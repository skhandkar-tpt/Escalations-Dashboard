<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escalations Dashboard</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f4f2;
  --surface-1: #fcfcfb;
  --surface-2: #f0efec;
  --border: #e2e1dc;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7974;
  --accent: #2a78d6;
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --good-ink: #006300;
  --warning-ink: #8a5a00;
  --critical-ink: #b02a2a;
  --good-bg: #e6f4e6;
  --warning-bg: #fdf3dc;
  --critical-bg: #fbe7e7;
  --row-hover: #f5f5f3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --surface-2: #242422;
    --border: #33332f;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --accent: #3987e5;
    --good-ink: #5fd35f;
    --warning-ink: #fac152;
    --critical-ink: #f08080;
    --good-bg: #16301a;
    --warning-bg: #352a12;
    --critical-bg: #3a1a1a;
    --row-hover: #222220;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #242422; --border: #33332f;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86; --accent: #3987e5;
  --good-ink: #5fd35f; --warning-ink: #fac152; --critical-ink: #f08080;
  --good-bg: #16301a; --warning-bg: #352a12; --critical-bg: #3a1a1a; --row-hover: #222220;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 14px 24px; background: var(--surface-1); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 5;
}
header h1 { font-size: 18px; margin: 0; font-weight: 650; }
.badge-src { font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px; }
.badge-src.live { background: var(--good-bg); color: var(--good-ink); }
.badge-src.demo { background: var(--warning-bg); color: var(--warning-ink); }
.badge-src.none { background: var(--critical-bg); color: var(--critical-ink); }
.spacer { flex: 1; }
.meta { color: var(--text-secondary); font-size: 12px; }
button, select, input {
  font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
}
button { cursor: pointer; }
button:hover { background: var(--surface-2); }
main { padding: 20px 24px 40px; max-width: 1500px; margin: 0 auto; }
.error {
  display: none; margin-bottom: 16px; padding: 10px 14px; border-radius: 8px;
  background: var(--critical-bg); color: var(--critical-ink); border: 1px solid var(--critical);
}
.grid-top { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; margin-bottom: 16px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.card h2 { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 0 0 12px; text-transform: uppercase; letter-spacing: .04em; }
.hero-num { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.hero-sub { color: var(--text-secondary); margin-top: 6px; }
.hero-state { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
.meter { height: 8px; background: var(--surface-2); border-radius: 4px; margin-top: 14px; overflow: hidden; }
.meter > div { height: 100%; border-radius: 4px; transition: width .4s; }
.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; cursor: pointer; text-align: left; }
.kpi:hover { background: var(--surface-2); }
.kpi.active { outline: 2px solid var(--accent); }
.kpi .label { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
.kpi .val { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 4px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 180px 1fr 36px; align-items: center; gap: 10px; cursor: pointer; }
.bar-row .name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .total { font-size: 13px; color: var(--text-secondary); text-align: right; font-variant-numeric: tabular-nums; }
.bar { display: flex; gap: 2px; height: 18px; }
.bar span { height: 100%; min-width: 3px; }
.bar span:first-child { border-radius: 4px 0 0 4px; }
.bar span:last-child { border-radius: 0 4px 4px 0; }
.bar span:only-child { border-radius: 4px; }
.bar-row:hover .name { color: var(--accent); }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 20px 0 12px; }
.filters input[type=search] { min-width: 240px; flex: 1; max-width: 420px; }
.filters .count { color: var(--text-secondary); font-size: 13px; margin-left: auto; }
.table-wrap { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--text-secondary); font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface-1); }
th:hover { color: var(--text-primary); }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--row-hover); }
td.subj { min-width: 240px; max-width: 420px; }
td.subj a { color: var(--text-primary); text-decoration: none; font-weight: 500; }
td.subj a:hover { color: var(--accent); text-decoration: underline; }
.idlink { color: var(--accent); text-decoration: none; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.healthy { background: var(--good-bg); color: var(--good-ink); }
.pill.at_risk { background: var(--warning-bg); color: var(--warning-ink); }
.pill.breached { background: var(--critical-bg); color: var(--critical-ink); }
.issues { color: var(--text-secondary); font-size: 12px; margin-top: 3px; }
.sla.over { color: var(--critical-ink); font-weight: 600; }
.sla.soon { color: var(--warning-ink); font-weight: 600; }
.muted { color: var(--text-muted); }
.empty { padding: 40px; text-align: center; color: var(--text-secondary); }
#tip { position: fixed; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.15); display: none; z-index: 10; }
#tip div { display: flex; align-items: center; gap: 6px; }
@media (max-width: 1100px) {
  .grid-top { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(3, 1fr); }
  .charts { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .hero-num { font-size: 44px; }
}
</style>
</head>
<body>
<header>
  <h1>Critical Ticket Escalations</h1>
  <span id="src" class="badge-src none">CONNECTING</span>
  <span class="meta" id="scope"></span>
  <span class="spacer"></span>
  <span class="meta" id="updated">-</span>
  <button id="refresh" title="Fetch latest from ServiceDesk Plus">Refresh now</button>
  <button id="theme" title="Toggle light/dark">◐</button>
</header>

<main>
  <div class="error" id="error"></div>

  <section class="grid-top">
    <div class="card">
      <h2>Ticket health</h2>
      <div class="hero-num" id="health">-</div>
      <div class="hero-sub" id="health-sub">Target 100% - every critical ticket inside SLA</div>
      <div class="meter"><div id="meter"></div></div>
      <div id="health-state"></div>
    </div>
    <div>
      <div class="kpis" id="kpis"></div>
      <div class="charts">
        <div class="card"><h2>By priority</h2><div class="legend" data-legend></div><div class="bars" id="by-priority"></div></div>
        <div class="card"><h2>By support group</h2><div class="legend" data-legend></div><div class="bars" id="by-group"></div></div>
      </div>
    </div>
  </section>

  <div class="filters">
    <input type="search" id="q" placeholder="Search ID, subject, technician, requester…">
    <select id="f-priority"><option value="">All priorities</option></select>
    <select id="f-health">
      <option value="">All health states</option>
      <option value="breached">Breached</option>
      <option value="at_risk">At risk</option>
      <option value="healthy">Healthy</option>
      <option value="needs_action">Needs action (breached + at risk)</option>
    </select>
    <select id="f-group"><option value="">All groups</option></select>
    <select id="f-tech"><option value="">All technicians</option></select>
    <button id="clear">Clear</button>
    <span class="count" id="count"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th data-sort="health">Health</th>
        <th data-sort="display_id">Ticket</th>
        <th data-sort="subject">Subject / issues</th>
        <th data-sort="priority">Priority</th>
        <th data-sort="status">Status</th>
        <th data-sort="technician">Technician</th>
        <th data-sort="group">Group</th>
        <th data-sort="due">Resolution due</th>
        <th data-sort="created">Age</th>
        <th data-sort="last_updated">Last update</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<div id="tip"></div>

<script>
const HEALTH = {
  breached: { label: "Breached", icon: "✕", color: "var(--critical)" },
  at_risk:  { label: "At risk",  icon: "!", color: "var(--warning)" },
  healthy:  { label: "Healthy",  icon: "✓", color: "var(--good)" },
};
const ORDER = ["breached", "at_risk", "healthy"];
let DATA = null, sortKey = null, sortDir = 1, timer = null, nextAt = 0;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---- theme
try { const t = localStorage.getItem("esc-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("esc-theme", next); } catch {}
};

// ---- time helpers
function dur(ms) {
  const a = Math.abs(ms), m = Math.round(a / 60000);
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60);
  if (h < 48) return h + "h " + (m % 60) + "m";
  return Math.floor(h / 24) + "d " + (h % 24) + "h";
}
const fmt = ms => ms ? new Date(ms).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";

// ---- fetch
async function load(force) {
  try {
    const r = await fetch("/api/tickets" + (force ? "?force=1" : ""), { cache: "no-store" });
    DATA = await r.json();
  } catch (e) {
    DATA = DATA || { tickets: [], source: "none", config: {} };
    DATA.error = "Dashboard server unreachable: " + e.message;
  }
  render();
  schedule();
}
function schedule() {
  clearTimeout(timer);
  const sec = (DATA?.config?.refresh_seconds) || 60;
  nextAt = Date.now() + sec * 1000;
  timer = setTimeout(() => load(false), sec * 1000);
}
setInterval(() => {
  if (!DATA?.fetched_at) return;
  const ago = Math.round((Date.now() - DATA.fetched_at) / 1000);
  const next = Math.max(0, Math.round((nextAt - Date.now()) / 1000));
  $("#updated").textContent = `Updated ${ago < 60 ? ago + "s" : dur(ago * 1000)} ago · next refresh in ${next}s`;
}, 1000);
$("#refresh").onclick = () => { $("#refresh").textContent = "Refreshing…"; load(true).then(() => $("#refresh").textContent = "Refresh now"); };

// ---- filters
const F = { q: "", priority: "", health: "", group: "", tech: "" };
let kpiFilter = null;
["q", "f-priority", "f-health", "f-group", "f-tech"].forEach(id => {
  $("#" + id).addEventListener("input", e => {
    const key = id === "q" ? "q" : id.slice(2) === "tech" ? "tech" : id.slice(2);
    F[key] = e.target.value; kpiFilter = null; renderTable(); renderKpis();
  });
});
$("#clear").onclick = () => {
  Object.keys(F).forEach(k => F[k] = "");
  ["q", "f-priority", "f-health", "f-group", "f-tech"].forEach(id => $("#" + id).value = "");
  kpiFilter = null; renderTable(); renderKpis();
};
function setFilter(key, val) {
  F[key] = val;
  const el = { priority: "#f-priority", health: "#f-health", group: "#f-group", tech: "#f-tech" }[key];
  if (el) $(el).value = val;
  renderTable(); renderKpis();
  document.querySelector(".filters").scrollIntoView({ behavior: "smooth", block: "start" });
}
function filtered() {
  const q = F.q.trim().toLowerCase();
  return DATA.tickets.filter(t => {
    if (F.priority && t.priority !== F.priority) return false;
    if (F.health === "needs_action" ? t.health === "healthy" : F.health && t.health !== F.health) return false;
    if (F.group && (t.group || "(none)") !== F.group) return false;
    if (F.tech && (t.technician || "Unassigned") !== F.tech) return false;
    if (kpiFilter === "unassigned" && t.technician) return false;
    if (q && ![t.display_id, t.subject, t.technician, t.requester, t.group, t.status].join(" ").toLowerCase().includes(q)) return false;
    return true;
  });
}
function fillSelect(sel, values, keepLabel) {
  const cur = sel.value;
  sel.innerHTML = `<option value="">${keepLabel}</option>` + values.map(v => `<option>${esc(v)}</option>`).join("");
  sel.value = values.includes(cur) ? cur : "";
}

// ---- render
function render() {
  const d = DATA;
  const src = $("#src");
  src.className = "badge-src " + (d.source || "none");
  src.textContent = d.source === "live" ? "LIVE" : d.source === "demo" ? "DEMO DATA" : "NO DATA";
  src.title = d.source === "demo" ? "No ServiceDesk Plus credentials configured - showing sample tickets. See README." : "";
  const lv = d.config?.levels || [];
  $("#scope").textContent = lv.length ? "Levels: " + lv.join(", ") : "";
  const err = $("#error");
  err.style.display = d.error ? "block" : "none";
  err.textContent = d.error ? "⚠ Could not refresh from ServiceDesk Plus - showing last good data. " + d.error : "";

  const pris = d.config?.priorities || [];
  fillSelect($("#f-priority"), pris, "All priorities");
  fillSelect($("#f-group"), [...new Set(d.tickets.map(t => t.group || "(none)"))].sort(), "All groups");
  fillSelect($("#f-tech"), [...new Set(d.tickets.map(t => t.technician || "Unassigned"))].sort(), "All technicians");
  F.priority = $("#f-priority").value; F.group = $("#f-group").value; F.tech = $("#f-tech").value;

  renderHero(); renderKpis(); renderCharts(); renderTable();
}

function counts(list) {
  const c = { breached: 0, at_risk: 0, healthy: 0 };
  list.forEach(t => c[t.health]++);
  return c;
}

function renderHero() {
  const t = DATA.tickets, c = counts(t), n = t.length;
  const pct = n ? Math.floor(((n - c.breached) / n) * 1000) / 10 : 100;
  $("#health").textContent = pct + "%";
  const state = c.breached ? "breached" : c.at_risk ? "at_risk" : "healthy";
  const meter = $("#meter");
  meter.style.width = pct + "%";
  meter.style.background = HEALTH[state].color;
  $("#health-sub").textContent = n
    ? `${n - c.breached} of ${n} open critical tickets within SLA · target 100%`
    : "No open critical tickets · target 100%";
  const msg = c.breached ? `${c.breached} breached - escalate now` : c.at_risk ? `100% - but ${c.at_risk} at risk` : "On target";
  $("#health-state").innerHTML = `<span class="hero-state pill ${state}">${HEALTH[state].icon} ${msg}</span>`;
  document.title = (c.breached ? `(${c.breached} breached) ` : "") + "Escalations Dashboard";
}

function renderKpis() {
  const t = DATA.tickets, c = counts(t);
  const unassigned = t.filter(x => !x.technician).length;
  const tiles = [
    { key: "all", label: "Open critical", val: t.length },
    { key: "breached", label: "Breached", val: c.breached, dot: HEALTH.breached.color },
    { key: "at_risk", label: "At risk", val: c.at_risk, dot: HEALTH.at_risk.color },
    { key: "healthy", label: "Healthy", val: c.healthy, dot: HEALTH.healthy.color },
    { key: "unassigned", label: "Unassigned", val: unassigned },
  ];
  const active = kpiFilter || (F.health && F.health !== "needs_action" ? F.health : (!F.health && !F.priority && !F.group && !F.tech && !F.q ? "all" : null));
  $("#kpis").innerHTML = tiles.map(k => `
    <button class="kpi ${active === k.key ? "active" : ""}" data-k="${k.key}">
      <div class="label">${k.dot ? `<span class="dot" style="background:${k.dot}"></span>` : ""}${k.label}</div>
      <div class="val">${k.val}</div>
    </button>`).join("");
  $("#kpis").querySelectorAll(".kpi").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    kpiFilter = k === "unassigned" ? "unassigned" : null;
    F.health = ["breached", "at_risk", "healthy"].includes(k) ? k : "";
    $("#f-health").value = F.health;
    renderTable(); renderKpis();
  });
}

function barChart(el, groups, filterKey) {
  const max = Math.max(1, ...groups.map(g => g.total));
  el.innerHTML = groups.length ? groups.map(g => `
    <div class="bar-row" data-v="${esc(g.name)}" data-c='${JSON.stringify(g.c)}'>
      <div class="name" title="${esc(g.name)}">${esc(g.name)}</div>
      <div class="bar" style="width:${(g.total / max) * 100}%">
        ${ORDER.filter(h => g.c[h]).map(h => `<span style="flex:${g.c[h]};background:${HEALTH[h].color}"></span>`).join("")}
      </div>
      <div class="total">${g.total}</div>
    </div>`).join("") : `<div class="muted">No tickets</div>`;
  el.querySelectorAll(".bar-row").forEach(r => {
    r.onclick = () => setFilter(filterKey, r.dataset.v);
    r.onmousemove = e => {
      const c = JSON.parse(r.dataset.c);
      const tip = $("#tip");
      tip.innerHTML = `<strong>${esc(r.dataset.v)}</strong>` + ORDER.map(h =>
        `<div><span class="dot" style="background:${HEALTH[h].color}"></span>${HEALTH[h].label}: <strong>${c[h]}</strong></div>`).join("") +
        `<div class="muted">Click to filter</div>`;
      tip.style.display = "block";
      tip.style.left = Math.min(e.clientX + 14, innerWidth - 180) + "px";
      tip.style.top = (e.clientY + 14) + "px";
    };
    r.onmouseleave = () => $("#tip").style.display = "none";
  });
}

function renderCharts() {
  document.querySelectorAll("[data-legend]").forEach(l => l.innerHTML = ORDER.map(h =>
    `<span><span class="dot" style="background:${HEALTH[h].color}"></span>${HEALTH[h].label}</span>`).join(""));
  const group = (keyFn, names) => {
    const m = new Map();
    (names || []).forEach(n => m.set(n, []));
    DATA.tickets.forEach(t => { const k = keyFn(t); if (!m.has(k)) m.set(k, []); m.get(k).push(t); });
    return [...m].map(([name, list]) => ({ name, c: counts(list), total: list.length }));
  };
  barChart($("#by-priority"), group(t => t.priority, DATA.config?.priorities), "priority");
  const groups = group(t => t.group || "(none)")
    .sort((a, b) => b.c.breached - a.c.breached || b.c.at_risk - a.c.at_risk || b.total - a.total)
    .slice(0, 8);
  barChart($("#by-group"), groups, "group");
}

function slaCell(t, now) {
  if (!t.due) return `<span class="muted">No SLA</span>`;
  const diff = t.due - now;
  const riskMs = (DATA.config?.at_risk_hours || 4) * 3600000;
  const cls = diff < 0 ? "over" : diff < riskMs ? "soon" : "";
  const txt = diff < 0 ? `Overdue ${dur(diff)}` : `in ${dur(diff)}`;
  return `<span class="sla ${cls}" title="${fmt(t.due)}">${txt}</span><div class="muted" style="font-size:11px">${fmt(t.due)}</div>`;
}

function renderTable() {
  const now = Date.now();
  let list = filtered();
  if (sortKey) {
    const hr = { breached: 0, at_risk: 1, healthy: 2 };
    const pr = Object.fromEntries((DATA.config?.priorities || []).map((p, i) => [p, i]));
    const val = t => sortKey === "health" ? hr[t.health] : sortKey === "priority" ? (pr[t.priority] ?? 99)
      : ["due", "created", "last_updated"].includes(sortKey) ? (t[sortKey] || 0) : String(t[sortKey] || "").toLowerCase();
    list = [...list].sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * sortDir);
  }
  $("#count").textContent = `${list.length} of ${DATA.tickets.length} tickets`;
  $("#rows").innerHTML = list.length ? list.map(t => {
    const h = HEALTH[t.health];
    const link = t.url ? `href="${esc(t.url)}" target="_blank" rel="noopener"` : "";
    return `<tr>
      <td><span class="pill ${t.health}">${h.icon} ${h.label}</span></td>
      <td><a class="idlink" ${link}>${esc(t.display_id)}</a></td>
      <td class="subj"><a ${link}>${esc(t.subject)}</a>${t.issues.length ? `<div class="issues">${t.issues.map(esc).join(" · ")}</div>` : ""}</td>
      <td>${t.priority_color ? `<span class="dot" style="background:${esc(t.priority_color)};margin-right:6px"></span>` : ""}${esc(t.priority)}</td>
      <td>${esc(t.status)}${t.sla_paused ? `<div class="muted" style="font-size:11px">⏸ SLA paused</div>` : ""}${t.level ? `<div class="muted" style="font-size:11px">${esc(t.level)}</div>` : ""}</td>
      <td>${t.technician ? esc(t.technician) : `<span class="sla soon">Unassigned</span>`}</td>
      <td>${esc(t.group || "")}</td>
      <td>${slaCell(t, now)}</td>
      <td title="${fmt(t.created)}">${t.created ? dur(now - t.created) : ""}</td>
      <td title="${fmt(t.last_updated)}">${t.last_updated ? dur(now - t.last_updated) + " ago" : `<span class="muted">-</span>`}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="10" class="empty">${DATA.tickets.length ? "No tickets match these filters." : "No open critical tickets right now. 🎉"}</td></tr>`;
}

document.querySelectorAll("th[data-sort]").forEach(th => th.onclick = () => {
  const k = th.dataset.sort;
  sortDir = sortKey === k ? -sortDir : 1; sortKey = k;
  document.querySelectorAll("th[data-sort]").forEach(x => x.textContent = x.textContent.replace(/ [▲▼]$/, ""));
  th.textContent += sortDir > 0 ? " ▲" : " ▼";
  renderTable();
});

load(false);
</script>
</body>
</html>
